<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Management System</title>
    <link rel="stylesheet" href="https://aspnetcdn.com">
    <style>
        body { background-color: #0b0b1e; color: #f3e8ff; font-family: system-ui, sans-serif; margin: 0; padding: 0; overflow: hidden; }
        .galaxy-header { background: linear-gradient(90deg, #1e1b4b 0%, #311042 50%, #1e1b4b 100%); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; height: 65px; box-sizing: border-box; }
        .main-layout { display: flex; height: calc(100vh - 65px); width: 100vw; }
        .sidebar { width: 260px; background-color: #0c0c24; border-right: 1px solid #2e1065; padding: 15px; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; }
        .new-chat-btn { background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); color: white; font-weight: bold; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; text-align: center; }
        .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-item { padding: 12px; border-radius: 8px; background-color: #161638; cursor: pointer; border: 1px solid #2e1065; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .chat-item.active { background-color: #2b145c; border-color: #a855f7; }
        .delete-chat-btn { background: none; border: none; color: #f87171; font-weight: bold; cursor: pointer; }
        .content-area { flex: 1; display: flex; flex-direction: column; background-color: #0b0b1e; position: relative; }
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 90px; box-sizing: border-box; }
        .bubble-row { display: flex; width: 100%; margin-bottom: 15px; }
        .justify-end { justify-content: flex-end; }
        .bubble { padding: 12px 16px; max-width: 80%; font-size: 14px; line-height: 1.5; border-radius: 16px; }
        .user-bubble { background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%); color: white; border-radius: 16px 16px 0px 16px; }
        .ai-bubble { background-color: #1e1b3a; color: #f3e8ff; border-radius: 16px 16px 16px 0px; border-left: 4px solid #a855f7; }
        .ai-img { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid #4c1d95; }
        .input-area { background-color: #0f0f2d; border-top: 1px solid #3b0764; padding: 15px; position: absolute; bottom: 0; left: 0; right: 0; }
        .input-group { max-w: 768px; margin: 0 auto; display: flex; gap: 10px; }
        .input-box { flex: 1; border: 1px solid #4c1d95; border-radius: 8px; padding: 10px 15px; background-color: #161638; color: white; }
        .galaxy-btn { background: linear-gradient(135deg, #6d28d9 0%, #4c1d95 100%); color: white; font-weight: bold; border: none; padding: 0px 25px; border-radius: 8px; cursor: pointer; }
        #login-overlay { position: fixed; inset: 0; background: radial-gradient(circle at center, #1a0b36 0%, #050515 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .login-card { background: #11112a; padding: 40px 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%; border-top: 6px solid #a855f7; color: #f3e8ff; }
        .login-input { width: 100%; border: 2px solid #4c1d95; border-radius: 10px; padding: 12px 15px; text-align: center; background-color: #1c1c44; color: white; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- 🔒 1. Login Mask -->
    <div id="login-overlay">
        <div class="login-card">
            <div style="font-size: 55px; margin-bottom: 15px;">🔮</div>
            <h2 class="font-weight-bold mb-2">Security Verification</h2>
            <p style="color: #9ca3af; font-size: 13px; margin-bottom: 20px;">Admin panel. Please enter credentials.</p>
            <input type="text" id="admin-username" class="login-input" placeholder="Username: ADMIN">
            <input type="password" id="admin-password" class="login-input" placeholder="Password: admin123" onkeypress="if(event.key==='Enter') verifyAdmin()">
            <button onclick="verifyAdmin()" class="galaxy-btn" style="width: 100%; padding: 12px 0;">Verify & Unlock</button>
            <p id="login-error" class="text-danger small mt-3" style="display: none; font-weight: bold;"></p>
        </div>
    </div>

    <!-- 2. Header -->
    <div class="galaxy-header">
        <div>
            <h1 style="margin:0; font-size:18px; font-weight:bold;">🌌 Galaxy System</h1>
            <small id="user-info" style="color: #c084fc;">Locked</small>
        </div>
        <button onclick="location.reload()" class="btn btn-sm btn-dark" style="background-color: #3b0764;">Lock</button>
    </div>

    <!-- 3. Layout -->
    <div class="main-layout">
        <div class="sidebar">
            <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
            <div class="chat-list" id="chat-list-container"></div>
        </div>
        <div class="content-area">
            <div class="chat-container" id="chat-box"></div>
            <div class="input-area">
                <div class="input-group">
                    <input type="text" id="user-input" class="input-box" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="galaxy-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chatSessions = {}, currentChatId = "";

        function verifyAdmin() {
            if (document.getElementById("admin-username").value.trim() === "ADMIN" && document.getElementById("admin-password").value.trim() === "admin123") {
                document.getElementById("login-overlay").style.display = "none";
                document.getElementById("user-info").innerText = "● Admin Connected";
                initSystem();
            } else {
                document.getElementById("login-error").innerText = "❌ Invalid Credentials!";
                document.getElementById("login-error").style.display = "block";
            }
        }

        function initSystem() {
            const saved = localStorage.getItem("galaxy_records");
            if (saved) {
                chatSessions = JSON.parse(saved);
                currentChatId = localStorage.getItem("galaxy_active_id") || Object.keys(chatSessions);
            }
            if (Object.keys(chatSessions).length === 0 || !chatSessions[currentChatId]) {
                currentChatId = "chat_" + Date.now();
                chatSessions[currentChatId] = { title: "💬 Chat 1", html: `<div class="bubble-row"><div class="bubble ai-bubble">🌌 <b>System Ready!</b><br>Type messages to chat. Include keywords like 'draw' or 'image' to trigger the AI generator tool automatically.</div></div>` };
            }
            renderSidebar();
            switchChat(currentChatId);
        }

        function renderSidebar() {
            const container = document.getElementById("chat-list-container");
            container.innerHTML = "";
            Object.keys(chatSessions).forEach(id => {
                const item = document.createElement("div");
                item.className = `chat-item ${id === currentChatId ? 'active' : ''}`;
                item.setAttribute("onclick", `switchChat('${id}')`);
                item.innerHTML = `<span>${chatSessions[id].title}</span><button class="delete-chat-btn" onclick="deleteChat(event, '${id}')">✕</button>`;
                container.appendChild(item);
            });
        }

        function createNewChat() {
            const id = "chat_" + Date.now();
            chatSessions[id] = { title: `💬 Chat ${Object.keys(chatSessions).length + 1}`, html: `<div class="bubble-row"><div class="bubble ai-bubble">🌌 New workspace connected.</div></div>` };
            currentChatId = id;
            saveData();
            switchChat(id);
        }

        function switchChat(id) {
            if (!chatSessions[id]) return;
            currentChatId = id;
            localStorage.setItem("galaxy_active_id", id);
            document.getElementById("chat-box").innerHTML = chatSessions[id].html;
            renderSidebar();
            document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            if (Object.keys(chatSessions).length <= 1) return alert("⚠️ Keep at least one space active.");
            if (confirm("Delete this workspace?")) {
                delete chatSessions[id];
                if (currentChatId === id) currentChatId = Object.keys(chatSessions);
                saveData();
                switchChat(currentChatId);
            }
        }

        function saveData() { localStorage.setItem("galaxy_records", JSON.stringify(chatSessions)); }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chat-box");
            const row = document.createElement("div");
            row.className = sender === 'user' ? "bubble-row justify-end" : "bubble-row";
            const bubble = document.createElement("div");
            bubble.className = sender === 'user' ? "bubble user-bubble" : "bubble ai-bubble";
            bubble.innerHTML = text;
            row.appendChild(bubble);
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
            chatSessions[currentChatId].html = chatBox.innerHTML;
            saveData();
            return bubble;
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
const text = input.value.trim();
if (!text) return;
appendMessage(text, 'user');
input.value = "";
const lowText = text.toLowerCase();
if (lowText.includes("draw") || lowText.includes("image") || lowText.includes("picture")) {
const aiBubble = appendMessage("Generating image...", 'ai');
setTimeout(() => {
aiBubble.innerHTML = 🌌 <b>AI Artwork Ready:</b><br><img src="https://picsum.photos{Date.now()}" class="ai-img" onload="document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;">;
chatSessions[currentChatId].html = document.getElementById("chat-box").innerHTML;
saveData();
}, 300);
} else {
const aiBubble = appendMessage("Thinking...", 'ai');
setTimeout(() => {
let reply = "🔮 System Response:
";
if (lowText.includes("hello") || lowText.includes("hi")) reply += "Hello Admin! System is fully operational and secure. How can I help you today? ✨";
else if (lowText.includes("feature")) reply += "Current specs: Unlimited workspaces, isolated state data management, fast local responses, and integrated image triggers.";
else reply += Message received successfully: "${text}". Log file has been securely updated in local storage.;
aiBubble.innerHTML = reply;
chatSessions[currentChatId].html = document.getElementById("chat-box").innerHTML;
saveData();
}, 500);
}
}
