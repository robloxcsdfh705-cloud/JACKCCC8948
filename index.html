<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星紫智慧導航系統</title>
    <!-- 引入網頁美化套件 -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-purple-50 h-screen flex flex-col justify-between font-sans">

    <!-- 頂部導覽列：純紫色科技感 -->
    <div class="bg-purple-700 text-white p-4 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold">🔮 星紫智慧導航系統</h1>
            <p id="status" class="text-xs text-green-300 font-bold">● 雲端 AI 核心已就緒 (免金鑰版)</p>
        </div>
        <span class="bg-purple-800 px-3 py-1 rounded-full text-xs border border-purple-500">免Token連線</span>
    </div>

    <!-- 聊天對話區域 -->
    <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start">
            <div class="bg-white p-3 rounded-lg shadow-sm max-w-[80%] text-gray-800 text-sm leading-relaxed border-l-4 border-purple-500">
                👋 歡迎造訪 <b>星紫智慧導航系統</b>！<br>
                本系統已切換為免費雲端驅動，<b>完全不需要輸入任何 API 金鑰</b>。請在下方輸入框直接打字，即可開始與 AI 進行自動回覆對話！
            </div>
        </div>
    </div>

    <!-- 底部輸入區域 -->
    <div class="bg-white border-t border-purple-100 p-4 shadow-lg">
        <div class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="user-input"
                   class="flex-1 border border-purple-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500" 
                   placeholder="請輸入訊息...">
            <button onclick="sendMessage()" class="bg-purple-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-purple-700 transition cursor-pointer">
                傳送
            </button>
        </div>
    </div>

    <!-- 核心控制腳本 -->
    <script>
        // 處理傳送訊息與 AI 自動回覆
        async function sendMessage() {
            const userInput = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const text = userInput.value.trim();
            if (!text) return;

            // 顯示使用者輸入
            appendMessage(text, 'user');
            userInput.value = "";

            // 建立 AI 思考中的對話泡泡
            const aiBubble = appendMessage("星紫助理正在接收雲端回應...", 'ai');

            try {
                // 💡 使用完全免費、不需任何密鑰的開源公共 AI 接口
                const systemPrompt = "你是一個實用的AI助理，名為星紫智慧導航系統，請一律使用繁體中文(台灣)進行親切專業的回覆。";
                const response = await fetch(`https://pollinations.ai`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: text }
                        ]
                    })
                });

                if (!response.ok) throw new Error("雲端伺服器回應異常");
                
                const replyText = await response.text();
                aiBubble.innerText = replyText;
            } catch (error) {
                aiBubble.innerText = "連線失敗，請稍後再試：" + error.message;
                aiBubble.classList.add("text-red-500");
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chat-box");
            const wrapper = document.createElement("div");
            wrapper.className = sender === 'user' ? "flex items-start justify-end" : "flex items-start";
            
            const bubble = document.createElement("div");
            bubble.className = sender === 'user' 
                ? "bg-purple-600 text-white p-3 rounded-lg shadow-sm max-w-[80%] text-sm" 
                : "bg-white text-gray-800 p-3 rounded-lg shadow-sm max-w-[80%] text-sm leading-relaxed border border-purple-100";
            bubble.innerText = text;

            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return bubble;
        }
    </script>
</body>
</html>
